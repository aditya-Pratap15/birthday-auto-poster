name: Clean YouTube Target Shorts

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/clean_youtube.yml'
      - 'scripts/delete_today_youtube.js'

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run YouTube Target Deletion
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          node scripts/delete_today_youtube.js | tee deletion_result.log

      - name: Commit Deletion Log
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add deletion_result.log || true
          git commit -m "docs: log youtube deletion results [skip ci]" || true
          git push || true

