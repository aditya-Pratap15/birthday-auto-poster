name: Test Runner Build Pipeline (No Posting)

on:
  workflow_dispatch:
  push:
    paths:
      - 'trigger_test_runner.txt'

permissions:
  contents: write

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup uv (Fast Python Package & Tool Runner)
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install System Dependencies (FFmpeg & Espeak-NG)
        timeout-minutes: 4
        run: |
          sudo apt-get update -o Acquire::http::Timeout="20" -o Acquire::Retries="3" || true
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ffmpeg espeak-ng libespeak-ng-dev fonts-liberation fonts-dejavu-core || true

      - name: Test Kokoro Neural TTS Directly
        env:
          PHONEMIZER_ESPEAK_LIBRARY: /usr/lib/x86_64-linux-gnu/libespeak-ng.so.1
        run: |
          echo "=== 1. Testing Kokoro AI TTS Standalone ==="
          mkdir -p temp_test
          echo "Happy birthday! Testing neural voice synthesis on the Ubuntu runner." > temp_test/sample.txt
          uv run --with kokoro --with faster-whisper --with soundfile --with numpy python scripts/kokoro_tts_generator.py temp_test/sample.txt af_bella temp_test/sample.mp3 temp_test/sample.json
          ls -lh temp_test/
          node -e "
          const fs = require('fs');
          if (fs.existsSync('temp_test/sample.mp3') && fs.statSync('temp_test/sample.mp3').size > 5000) {
            console.log('[✓] Kokoro AI synthesized sample.mp3 successfully! Size: ' + fs.statSync('temp_test/sample.mp3').size + ' bytes');
          } else {
            console.error('[!] Failed to generate Kokoro audio.');
            process.exit(1);
          }
          if (fs.existsSync('temp_test/sample.json')) {
            const words = JSON.parse(fs.readFileSync('temp_test/sample.json', 'utf8'));
            console.log('[✓] Whisper word alignment captured ' + words.length + ' words!');
          }
          "

      - name: Install Node Dependencies
        run: npm install

      - name: Test Pixel-Perfect Collage Generator
        run: |
          echo "=== 2. Testing Collage Studio ==="
          node scripts/build_collage_studio.js
          ls -lh collages/

      - name: Test Vertical Reel Generation with Kokoro AI
        env:
          PHONEMIZER_ESPEAK_LIBRARY: /usr/lib/x86_64-linux-gnu/libespeak-ng.so.1
        run: |
          echo "=== 3. Testing Vertical Reel Generation (Headliner 1) ==="
          node scripts/build_reel_studio.js --index 1
          ls -lh reels/

      - name: Verify All Test Artifacts
        run: |
          echo "=== 4. Final Media Verification (Zero Posting) ==="
          node -e "
          const fs = require('fs');
          const d = JSON.parse(fs.readFileSync('today_posts.json', 'utf8'));
          const p1 = (d.posts || [])[0];
          const name = (p1?.celebrity_name || '').replace(/[^a-zA-Z0-9]/g, '_');
          const reelPath = 'reels/' + name + '_Reel.mp4';
          
          let report = [];
          report.push('Test Build Run: ' + new Date().toISOString());
          report.push('Celebrity: ' + (p1?.celebrity_name || 'N/A'));
          
          if (fs.existsSync(reelPath)) {
            const sizeMb = (fs.statSync(reelPath).size / 1048576).toFixed(2);
            report.push('[✓] Vertical Reel generated: ' + reelPath + ' (' + sizeMb + ' MB)');
            console.log('[✓] SUCCESS: ' + reelPath + ' (' + sizeMb + ' MB)');
          } else {
            report.push('[!] FAILED: Vertical Reel missing at ' + reelPath);
            console.error('[!] FAILED: ' + reelPath);
            process.exit(1);
          }
          
          fs.writeFileSync('test_run_log.txt', report.join('\n') + '\n');
          "

      - name: Record Test Results in Repository (No Posting)
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add test_run_log.txt 2>/dev/null || true
          git commit -m "chore(test): record test runner build results [skip ci]" || echo "No changes"
          git fetch origin main
          git merge origin/main -X ours -m "chore(test): merge remote updates [skip ci]" || true
          git push origin main || true
