name: Post to YouTube Shorts

on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Force replace existing YouTube shorts'
        type: boolean
        default: true
  push:
    paths:
      - 'trigger_youtube.txt'

permissions:
  contents: write

jobs:
  youtube-shorts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node Dependencies
        run: npm install

      - name: Post Top Headliners and Quiz Reels to YouTube Shorts
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          node scripts/post_to_youtube.js --force > youtube_run.log 2>&1 || true
          cat youtube_run.log
          if grep -q "SUCCESS!" youtube_run.log; then
            echo "Uploaded successfully"
          elif grep -q "Fatal" youtube_run.log || grep -q "Error" youtube_run.log; then
            exit 1
          fi

      - name: Commit Updated YouTube IDs or Error Log
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add today_posts.json youtube_run.log 2>/dev/null || true
          git commit -m "chore(youtube): sync youtube run log [skip ci]" || echo "No changes"
          git pull --rebase origin main || true
          git push origin main || echo "Push bypassed"
