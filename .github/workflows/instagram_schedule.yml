name: Instagram Scheduled Auto Poster

on:
  schedule:
    # Drop 1 (US Morning Commute / 8:00 AM EDT)
    - cron: '0 12 * * *'   # 5:30 PM IST (12:00 UTC) -> Headliner 1: Photo Carousel
    - cron: '45 12 * * *'  # 6:15 PM IST (12:45 UTC) -> Headliner 1: Vertical Reel [+45m offset]

    # Drop 2 (US Lunchtime Peak / 1:00 PM EDT)
    - cron: '0 17 * * *'   # 10:30 PM IST (17:00 UTC) -> Headliner 2: Photo Carousel
    - cron: '45 17 * * *'  # 11:15 PM IST (17:45 UTC) -> Headliner 2: Vertical Reel [+45m offset]

    # Drop 3 (US Evening Primetime / 6:00 PM EDT)
    - cron: '0 22 * * *'   # 3:30 AM IST (22:00 UTC) -> Headliner 3: Photo Carousel
    - cron: '45 22 * * *'  # 4:15 AM IST (22:45 UTC) -> Headliner 3: Vertical Reel [+45m offset]

  workflow_dispatch:
    inputs:
      celeb_target:
        description: 'Headliner target (1, 2, 3, or auto)'
        required: false
        default: 'auto'
      action_type:
        description: 'Action type (carousel, reel, or auto)'
        required: false
        default: 'auto'

permissions:
  contents: write

jobs:
  instagram-post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install

      - name: Post Scheduled Drop to Instagram
        env:
          FB_TOKEN_BORN: ${{ secrets.FB_PAGE_TOKEN_BORN_TODAY || secrets.FB_TOKEN_BORN || secrets.FB_PAGE_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID || '17841416842135384' }}
          TARGET: ${{ github.event.inputs.celeb_target || 'auto' }}
          ACTION: ${{ github.event.inputs.action_type || 'auto' }}
        run: node scripts/post_to_instagram.js --target "$TARGET" --type "$ACTION"

      - name: Commit Post Logs and Media Cleanup
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add today_posts.json reels/
          git commit -m "chore(instagram): record scheduled drop and cleanup media [skip ci]" || echo "No changes to commit"
          git push || true
