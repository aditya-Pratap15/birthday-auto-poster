name: Instagram Scheduled Auto Poster & Facebook Comment Syncer

on:
  repository_dispatch:
    types: [instagram_drop, instagram_post]
  schedule:
    # Drop 1 (US Morning Commute / 8:00 AM EDT)
    - cron: '0 12 * * *'   # 5:30 PM IST (12:00 UTC) -> Headliner 1: Photo Carousel
    - cron: '45 12 * * *'  # 6:15 PM IST (12:45 UTC) -> Headliner 1: Vertical Reel [+45m offset]

    # Quiz Drop 1 (US Mid-Morning Trivia / 10:00 AM EDT)
    - cron: '0 14 * * *'   # 7:30 PM IST (14:00 UTC) -> Quiz 1: Photo Quiz Type 1

    # Quiz Drop 2 (US Midday Reel Challenge / 11:30 AM EDT)
    - cron: '30 15 * * *'  # 9:00 PM IST (15:30 UTC) -> Quiz 2: Reel Quiz Type 1

    # Drop 2 (US Lunchtime Peak / 1:00 PM EDT)
    - cron: '0 17 * * *'   # 10:30 PM IST (17:00 UTC) -> Headliner 2: Photo Carousel
    - cron: '45 17 * * *'  # 11:15 PM IST (17:45 UTC) -> Headliner 2: Vertical Reel [+45m offset]

    # Quiz Drop 3 (US Afternoon Trivia / 3:30 PM EDT)
    - cron: '30 19 * * *'  # 1:00 AM IST +1 (19:30 UTC) -> Quiz 3: Photo Quiz Type 2 (4-Face Match)

    # Quiz Drop 4 (US Evening Primetime Reel / 5:00 PM EDT)
    - cron: '0 21 * * *'   # 2:30 AM IST +1 (21:00 UTC) -> Quiz 4: Reel Quiz Type 2 (Video Face Match)

    # Drop 3 (US Evening Primetime / 6:00 PM EDT)
    - cron: '0 22 * * *'   # 3:30 AM IST +1 (22:00 UTC) -> Headliner 3: Photo Carousel
    - cron: '45 22 * * *'  # 4:15 AM IST +1 (22:45 UTC) -> Headliner 3: Vertical Reel [+45m offset]

  workflow_dispatch:
    inputs:
      celeb_target:
        description: 'Target (1, 2, 3, quiz_photo_1, quiz_reel_1, quiz_photo_2, quiz_reel_2, or auto)'
        required: false
        default: 'auto'
      action_type:
        description: 'Action type (carousel, reel, photo, or auto)'
        required: false
        default: 'auto'

permissions:
  contents: write

jobs:
  instagram-post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies (Edge-TTS Engine)
        run: pip install --upgrade edge-tts

      - name: Install Dependencies
        run: npm install

      - name: Install FFmpeg & Multimedia Dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Determine Scheduled Target
        id: target
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "target=${{ github.event.inputs.celeb_target }}" >> $GITHUB_OUTPUT
            echo "action=${{ github.event.inputs.action_type }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "target=${{ github.event.client_payload.celeb_target || 'auto' }}" >> $GITHUB_OUTPUT
            echo "action=${{ github.event.client_payload.action_type || 'auto' }}" >> $GITHUB_OUTPUT
          else
            HOUR=$(date -u +%H)
            MIN=$(date -u +%M)
            echo "Current UTC Time: $HOUR:$MIN"
            if [ "$HOUR" -eq 12 ]; then
              if [ "$MIN" -ge 30 ]; then echo "target=1"; echo "action=reel"; else echo "target=1"; echo "action=carousel"; fi
            elif [ "$HOUR" -eq 14 ]; then
              echo "target=quiz_photo_1"; echo "action=photo"
            elif [ "$HOUR" -eq 15 ]; then
              echo "target=quiz_reel_1"; echo "action=reel"
            elif [ "$HOUR" -eq 17 ]; then
              if [ "$MIN" -ge 30 ]; then echo "target=2"; echo "action=reel"; else echo "target=2"; echo "action=carousel"; fi
            elif [ "$HOUR" -eq 19 ]; then
              echo "target=quiz_photo_2"; echo "action=photo"
            elif [ "$HOUR" -eq 21 ]; then
              echo "target=quiz_reel_2"; echo "action=reel"
            elif [ "$HOUR" -eq 22 ]; then
              if [ "$MIN" -ge 30 ]; then echo "target=3"; echo "action=reel"; else echo "target=3"; echo "action=carousel"; fi
            else
              echo "target=auto"; echo "action=auto"
            fi >> $GITHUB_OUTPUT
          fi

      - name: Post Scheduled Drop to Instagram
        env:
          FB_TOKEN_BORN: ${{ secrets.FB_PAGE_TOKEN_BORN_TODAY || secrets.FB_TOKEN_BORN || secrets.FB_PAGE_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID || '17841416842135384' }}
          TARGET: ${{ steps.target.outputs.target }}
          ACTION: ${{ steps.target.outputs.action }}
        run: node scripts/post_to_instagram.js --target "$TARGET" --type "$ACTION"

      - name: Sync Facebook Pinned Comments for Live Posts
        env:
          FB_TOKEN_BORN: ${{ secrets.FB_PAGE_TOKEN_BORN_TODAY || secrets.FB_TOKEN_BORN || secrets.FB_PAGE_TOKEN }}
        run: node scripts/sync_facebook_comments.js

      - name: Commit Post Logs and Media Cleanup
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A today_posts.json collages/ reels/ 2>/dev/null || git add -A
          git commit -m "chore(automation): record scheduled drop and sync live comments [skip ci]" || echo "No changes to commit"
          git pull --rebase origin main || true
          git push origin main || (sleep 3 && git pull --rebase origin main && git push origin main) || echo "Push bypassed"
