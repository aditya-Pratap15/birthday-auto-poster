name: Daily Birthday Poster

on:
  repository_dispatch:
    types: [new_celebrity_data]
  schedule:
    - cron: '30 1 * * *'  # 7:00 AM IST daily (after Gemini 6:00 AM run)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-automation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node Dependencies
        run: npm install

      - name: Sync Incoming Daily Celebrity Payload
        env:
          DISPATCH_PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: node scripts/sync_daily_payload.js

      - name: Build Pixel-Perfect Collages with Viral Teaser Engine
        run: node scripts/build_collage_studio.js

      - name: Build Vertical Reels with Neural Voiceover & Dynamic Captions
        run: node scripts/build_reel_studio.js --all

      - name: Post to Facebook Pages with Unicode Bold & Pinned Comments
        env:
          FB_TOKEN_BORN: ${{ secrets.FB_PAGE_TOKEN_BORN_TODAY || secrets.FB_TOKEN_BORN || secrets.FB_PAGE_TOKEN }}
          FB_PAGE_ID_BORN: ${{ secrets.FB_PAGE_ID_BORN_TODAY || secrets.FB_PAGE_ID_BORN || secrets.FB_PAGE_ID }}
        run: node scripts/post_to_facebook.js

      - name: Clean Uploaded Media & Commit Post Logs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          rm -f collages/*.jpg collages/*.png collages/*.webp reels/*.mp4 current_subs.ass
          rm -rf temp_reel_assets/*
          git add today_posts.json collages/.gitkeep reels/.gitkeep
          git commit -m "chore(automation): sync schedule logs and clean media [skip ci]" || echo "No changes to commit"
          git push || true

