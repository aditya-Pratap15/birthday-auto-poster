name: Daily Birthday Poster
on:
  schedule:
    - cron: '30 0 * * *'  # 6:00 AM IST daily
  workflow_dispatch:
  push:
    paths:
      - 'today_posts.json'

jobs:
  post-to-facebook:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
          
      - name: Install dependencies
        run: pip install requests Pillow
        
      - name: Build Automated Collages from Presets
        run: python scripts/build_collage.py
        
      - name: Post to Facebook Pages
        env:
          FB_TOKEN_BORN: ${{ secrets.FB_PAGE_TOKEN_BORN_TODAY || secrets.FB_TOKEN_BORN }}
          FB_TOKEN_STAR: ${{ secrets.FB_PAGE_TOKEN_STARBORN || secrets.FB_TOKEN_STAR }}
          FB_TOKEN_VAULT: ${{ secrets.FB_PAGE_TOKEN_VAULT || secrets.FB_TOKEN_VAULT }}
          FB_PAGE_ID_BORN: ${{ secrets.FB_PAGE_ID_BORN_TODAY || secrets.FB_PAGE_ID_BORN }}
          FB_PAGE_ID_STAR: ${{ secrets.FB_PAGE_ID_STARBORN || secrets.FB_PAGE_ID_STAR }}
          FB_PAGE_ID_VAULT: ${{ secrets.FB_PAGE_ID_VAULT || secrets.FB_PAGE_ID_VAULT }}
        run: python scripts/post_to_facebook.py
