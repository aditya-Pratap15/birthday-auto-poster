name: Daily Birthday Poster

on:
  repository_dispatch:
    types: [new_celebrity_data]
  schedule:
    - cron: '43 1 * * *'  # 7:13 AM IST daily (Primary off-peak run, 01:43 UTC)
  workflow_dispatch:
    inputs:
      force_run:
        description: 'Force execution even if already completed today'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  daily-automation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check If Today's Posts Already Scheduled
        id: check_status
        env:
          FORCE_RUN: ${{ inputs.force_run || github.event.inputs.force_run || 'false' }}
        run: node scripts/check_daily_status.js

      - name: Setup Python and Install Edge-TTS Engine
        if: steps.check_status.outputs.already_done != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Latest Edge-TTS & Local ML Background Remover
        if: steps.check_status.outputs.already_done != 'true'
        run: pip install --upgrade edge-tts rembg onnxruntime pillow

      - name: Install Node Dependencies
        if: steps.check_status.outputs.already_done != 'true'
        run: npm install

      - name: Install FFmpeg & Multimedia Dependencies
        if: steps.check_status.outputs.already_done != 'true'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Sync Incoming Daily Celebrity Payload
        if: steps.check_status.outputs.already_done != 'true'
        env:
          DISPATCH_PAYLOAD: ${{ toJson(github.event.client_payload) }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY || '09ad47354cf2588cd01875ba6e225d07' }}
        run: node scripts/sync_daily_payload.js

      - name: Build Pixel-Perfect Collages with Viral Teaser Engine
        if: steps.check_status.outputs.already_done != 'true'
        run: node scripts/build_collage_studio.js

      - name: Build Vertical Reels with Neural Voiceover & Dynamic Captions
        if: steps.check_status.outputs.already_done != 'true'
        run: node scripts/build_reel_studio.js --all

      - name: Build Interactive Celebrity Quiz Posts & Reels
        if: steps.check_status.outputs.already_done != 'true'
        continue-on-error: true
        run: node scripts/build_quiz_studio.js

      - name: Post to Facebook Pages with Unicode Bold & Pinned Comments
        if: steps.check_status.outputs.already_done != 'true'
        env:
          FB_TOKEN_BORN: ${{ secrets.FB_PAGE_TOKEN_BORN_TODAY || secrets.FB_TOKEN_BORN || secrets.FB_PAGE_TOKEN }}
          FB_PAGE_ID_BORN: ${{ secrets.FB_PAGE_ID_BORN_TODAY || secrets.FB_PAGE_ID_BORN || secrets.FB_PAGE_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID || '17841416842135384' }}
        run: node scripts/post_to_facebook.js

      - name: Publish Interactive Celebrity Quizzes to Facebook Page
        if: steps.check_status.outputs.already_done != 'true'
        continue-on-error: true
        env:
          FB_TOKEN_BORN: ${{ secrets.FB_PAGE_TOKEN_BORN_TODAY || secrets.FB_PAGE_TOKEN_BORN || secrets.FB_PAGE_TOKEN }}
          FB_PAGE_ID_BORN: ${{ secrets.FB_PAGE_ID_BORN_TODAY || secrets.FB_PAGE_ID_BORN || secrets.FB_PAGE_ID }}
        run: node scripts/post_quiz_to_facebook.js

      - name: Post Top Reels to YouTube Shorts
        if: steps.check_status.outputs.already_done != 'true'
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: node scripts/post_to_youtube.js

      - name: Clean Non-Headliner Media & Stage Reels and Collages for Instagram
        if: steps.check_status.outputs.already_done != 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          rm -f current_subs.ass
          rm -rf temp_reel_assets/*
          # Clean non-headliner collages and reels (preserve top 3 for scheduled Instagram drops)
          node scripts/clean_staged_media.js
          git add -A today_posts.json collages/ reels/ 2>/dev/null || git add -A
          git commit -m "chore(automation): sync schedule logs and stage headliner media [skip ci]" || echo "No changes to commit"
          git pull --rebase origin main || true
          git push origin main || (sleep 3 && git pull --rebase origin main && git push origin main) || echo "Push bypassed"
