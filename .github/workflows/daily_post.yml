name: Daily Birthday Poster

on:
  repository_dispatch:
    types: [new_celebrity_data]
  schedule:
    - cron: '30 1 * * *'  # 7:00 AM IST daily (after Gemini 6:00 AM run)
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - 'collages/**'
      - 'today_posts.json'
      - 'README.md'

permissions:
  contents: write

jobs:
  daily-automation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node Dependencies
        run: npm install puppeteer

      - name: Sync Incoming Daily Celebrity Payload
        env:
          DISPATCH_PAYLOAD: ${{ toJson(github.event.client_payload) }}
        run: node scripts/sync_daily_payload.js

      - name: Build Pixel-Perfect Collages with Viral Teaser Engine
        run: node scripts/build_collage_studio.js

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Python Dependencies
        run: pip install requests Pillow

      - name: Post to Facebook Pages with Unicode Bold & Pinned Comments
        env:
          FB_TOKEN_BORN: ${{ secrets.FB_PAGE_TOKEN_BORN_TODAY || secrets.FB_TOKEN_BORN || secrets.FB_PAGE_TOKEN }}
          FB_PAGE_ID_BORN: ${{ secrets.FB_PAGE_ID_BORN_TODAY || secrets.FB_PAGE_ID_BORN || secrets.FB_PAGE_ID }}
        run: python scripts/post_to_facebook.py

      - name: Commit and Push Generated Collages & Post Logs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add today_posts.json collages/
          git diff --quiet && git diff --staged --quiet || git commit -m "chore(automation): sync collages and schedule [skip ci]"
          git push || true
