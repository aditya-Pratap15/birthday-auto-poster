name: Daily Automation Checker Bot (9:23 AM IST)

on:
  schedule:
    - cron: '53 3 * * *'  # 9:23 AM IST daily (03:53 UTC)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect-status:
    name: Verify 7:13 AM IST Automation Status
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
      already_done: ${{ steps.check.outputs.already_done }}
      target_date: ${{ steps.check.outputs.target_date }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Inspect Today's Posts Status
        id: check
        run: node scripts/check_daily_status.js

  backup-automation-run:
    name: Trigger Fail-Safe Backup Pipeline
    needs: inspect-status
    if: needs.inspect-status.outputs.should_run == 'true'
    uses: ./.github/workflows/daily_post.yml
    with:
      force_run: true
    secrets: inherit
